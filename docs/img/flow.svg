<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Inter, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b0562c"/></marker>
  <style>.bg{fill:#f7f4ef}.box{fill:#fff;stroke:#e0d6c8;stroke-width:1.5}.hub{fill:#26201a}.t{font-size:14px;font-weight:600;fill:#26201a}.s{font-size:11.5px;fill:#74685b}.w{fill:#fff}.ws{fill:#e0d6c8}.l{stroke:#b0562c;stroke-width:2;fill:none}.k{font-size:11px;font-weight:700;fill:#b0562c}</style></defs>
  <rect class="bg" width="920" height="330" rx="14"/>
  <text x="30" y="36" class="t" style="font-size:17px">One investigation, start to case file. No language model on the decision path.</text>

  <rect class="box" x="30" y="66" width="130" height="78" rx="10"/><text x="95" y="96" text-anchor="middle" class="t">Alert</text><text x="95" y="116" text-anchor="middle" class="s">one flagged</text><text x="95" y="130" text-anchor="middle" class="s">transaction</text>
  <rect class="box" x="195" y="66" width="190" height="78" rx="10"/><text x="290" y="92" text-anchor="middle" class="t">10 TigerGraph queries</text><text x="290" y="112" text-anchor="middle" class="s">transaction, card window,</text><text x="290" y="127" text-anchor="middle" class="s">holder history, device neighbours</text>
  <rect class="box" x="420" y="66" width="200" height="78" rx="10"/><text x="520" y="92" text-anchor="middle" class="t">Detectors</text><text x="520" y="112" text-anchor="middle" class="s">structuring, device ring,</text><text x="520" y="127" text-anchor="middle" class="s">card testing, recurring charge</text>
  <rect class="hub" x="655" y="66" width="235" height="78" rx="10"/><text x="772" y="92" text-anchor="middle" class="t w">Probability</text><text x="772" y="112" text-anchor="middle" class="s ws">calibrated model score,</text><text x="772" y="127" text-anchor="middle" class="s ws">times each finding's likelihood ratio</text>

  <path class="l" d="M160 105 H195" marker-end="url(#a)"/><path class="l" d="M385 105 H420" marker-end="url(#a)"/><path class="l" d="M620 105 H655" marker-end="url(#a)"/>
  <path class="l" d="M772 144 V176 H700" marker-end="url(#a)"/>

  <rect class="box" x="430" y="156" width="270" height="78" rx="10"/><text x="565" y="182" text-anchor="middle" class="t">Gate: confident enough?</text><text x="565" y="202" text-anchor="middle" class="s">stop at 0.85 or 0.15 on two independent</text><text x="565" y="217" text-anchor="middle" class="s">findings, else ask for evidence and update</text>
  <path class="l" d="M430 195 H385" marker-end="url(#a)"/>
  <rect class="box" x="195" y="156" width="190" height="78" rx="10"/><text x="290" y="182" text-anchor="middle" class="t">Policy v1.0 (code)</text><text x="290" y="202" text-anchor="middle" class="s">actions and routes,</text><text x="290" y="217" text-anchor="middle" class="s">50 tests, mostly negatives</text>
  <path class="l" d="M195 195 H160" marker-end="url(#a)"/>
  <rect class="box" x="30" y="156" width="130" height="78" rx="10"/><text x="95" y="182" text-anchor="middle" class="t">Case file</text><text x="95" y="202" text-anchor="middle" class="s">verdict, p, exposure,</text><text x="95" y="217" text-anchor="middle" class="s">SAR, query per claim</text>
  <path class="l" d="M95 234 V268 H290 V286" marker-end="url(#a)" style="display:none"/>
  <rect class="box" x="30" y="260" width="860" height="50" rx="10"/><text x="460" y="282" text-anchor="middle" class="t">FraudCase written back to TigerGraph</text><text x="460" y="299" text-anchor="middle" class="s">the next investigation retrieves it as memory (causal: only cases opened earlier)</text>
  <path class="l" d="M95 234 V260" marker-end="url(#a)"/>
</svg>
