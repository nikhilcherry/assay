name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Policy, detectors and the 20 answer files. None of these need the
      # dataset or a database; the answer-file tests validate cases/ as committed.
      - run: PYTHONPATH=. python -m pytest -q tests
